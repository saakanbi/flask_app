<!DOCTYPE html>
<html>
<head>
  <title>Secure Flask App</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-image: url("{{ url_for('static', filename='ceeyit.png') }}");
      background-size: cover;
      background-repeat: no-repeat;
      background-position: center;
      height: 100vh;
      font-family: sans-serif;
      color: white;
      text-shadow: 1px 1px 3px rgba(0,0,0,0.7);
    }

    .content {
      background-color: rgba(0, 0, 0, 0.5);
      max-width: 700px;
      margin: 0 auto;
      padding: 40px;
      border-radius: 10px;
      margin-top: 10%;
    }
  </style>
</head>
<body>
  <div class="content">
    <h1>Secure DevOps app deployed with verified artifact!</h1>
    <h2>This app was built by Oyewole, Yaro & MJ</h2>

    <ul>
      {% for msg in messages %}
        <li><strong>{{ msg['sender'] }}</strong>: {{ msg['content'] }}</li>
      {% endfor %}
    </ul>
  </div>
</body>
</html>
