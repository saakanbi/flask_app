- name: Add MongoDB public key
  apt_key:
    url: https://pgp.mongodb.com/server-6.0.asc
    state: present

- name: Add MongoDB repo
  apt_repository:
    repo: "deb [ arch=amd64 ] https://repo.mongodb.org/apt/ubuntu focal/mongodb-org/6.0 multiverse"
    state: present
    filename: mongodb-org-6.0

- name: Install MongoDB
  apt:
    name: mongodb-org
    update_cache: yes
    state: present

- name: Ensure mongo shell is available
  stat:
    path: /usr/bin/mongo
  register: mongo_shell_check

- name: Fail if mongo shell is missing
  fail:
    msg: "Mongo shell not found at /usr/bin/mongo"
  when: not mongo_shell_check.stat.exists


- name: Start and enable MongoDB
  systemd:
    name: mongod
    state: started
    enabled: true


- name: Seed MongoDB with sample messages
  copy:
    dest: /tmp/seed.js
    content: |
      use securedb;
      if (db.messages.countDocuments() === 0) {
        db.messages.insertMany([
          { text: "Welcome to Team32!" },
          { text: "Your app is secured and verified." },
          { text: "Deployed using Ansible + Jenkins + Flask!" }
        ]);
      ]

- name: Run seed script
  shell: /usr/bin/mongo /tmp/seed.js


- name: Remove seed script
  file:
    path: /tmp/seed.js
    state: absent

- name: Ping MongoDB
  command: /usr/bin/mongo --eval "db.adminCommand('ping')"
  register: mongodb_ping
  changed_when: false
  failed_when: mongodb_ping.rc != 0

- name: Check seeded messages count
  command: /usr/bin/mongo --eval "use securedb; db.messages.countDocuments()"
  register: mongodb_messages
  changed_when: false
  failed_when: mongodb_messages.rc != 0


- name: Show seeded message count
  debug:
    var: mongodb_messages.stdout_lines

- name: View MongoDB log tail
  command: tail -n 10 /var/log/mongodb/mongod.log
  register: mongodb_logs
  changed_when: false
