- name: Add MongoDB public GPG key using apt-key (fallback method)
  shell: |
    curl -fsSL https://pgp.mongodb.com/server-6.0.asc | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/mongodb.gpg
  args:
    executable: /bin/bash

- name: Add MongoDB 6.0 repository
  apt_repository:
    repo: "deb [ arch=amd64 ] https://repo.mongodb.org/apt/ubuntu focal/mongodb-org/6.0 multiverse"
    state: present
    filename: mongodb-org-6.0

- name: Install MongoDB
  apt:
    name: mongodb-org
    update_cache: yes
    state: present


- name: Start and enable MongoDB
  systemd:
    name: mongod
    state: started
    enabled: true

- name: Seed MongoDB with sample messages
  copy:
    dest: /tmp/seed.js
    content: |
      use securedb;
      db.messages.insertMany([
        { text: "Welcome to Team32!" },
        { text: "Your app is secured and verified." },
        { text: "Deployed using Ansible + Jenkins + Flask!" }
      ]);

- name: Run seed script
  shell: mongo /tmp/seed.js

- name: Remove seed script (optional cleanup)
  file:
    path: /tmp/seed.js
    state: absent
