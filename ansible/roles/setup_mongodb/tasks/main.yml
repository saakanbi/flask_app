- name: Ensure gnupg and curl are installed
  apt:
    name:
      - gnupg
      - curl
    state: present
    update_cache: yes

- name: Add MongoDB public GPG key using apt_key (clean, non-blocking)
  apt_key:
    url: https://pgp.mongodb.com/server-6.0.asc
    state: present

- name: Add MongoDB 6.0 repository
  apt_repository:
    repo: "deb [ arch=amd64 ] https://repo.mongodb.org/apt/ubuntu focal/mongodb-org/6.0 multiverse"
    state: present
    filename: mongodb-org-6.0

- name: Download libssl1.1 package (for Ubuntu 22.04+)
  get_url:
    url: http://security.ubuntu.com/ubuntu/pool/main/o/openssl1.1/libssl1.1_1.1.1f-1ubuntu2.22_amd64.deb
    dest: /tmp/libssl1.1.deb

- name: Install libssl1.1 package with retries
  apt:
    deb: /tmp/libssl1.1.deb
    state: present
  register: libssl_install
  until: libssl_install is succeeded
  retries: 3
  delay: 5

- name: Install MongoDB
  apt:
    name: mongodb-org
    update_cache: yes
    state: present

- name: Start and enable MongoDB service
  systemd:
    name: mongod
    state: started
    enabled: true

- name: Seed MongoDB with sample messages
  copy:
    dest: /tmp/seed.js
    content: |
      use securedb;
      db.messages.insertMany([
        { text: "Welcome to Team32!" },
        { text: "Your app is secured and verified." },
        { text: "Deployed using Ansible + Jenkins + Flask!" }
      ]);

- name: Run seed script
  shell: mongo /tmp/seed.js

- name: Remove seed script (optional cleanup)
  file:
    path: /tmp/seed.js
    state: absent
