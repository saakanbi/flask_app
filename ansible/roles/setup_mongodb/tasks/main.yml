- name: Add MongoDB public key
  apt_key:
    url: https://pgp.mongodb.com/server-6.0.asc
    state: present

- name: Add MongoDB repo
  apt_repository:
    repo: "deb [ arch=amd64 ] https://repo.mongodb.org/apt/ubuntu focal/mongodb-org/6.0 multiverse"
    state: present
    filename: mongodb-org-6.0

- name: Install MongoDB (includes mongosh)
  apt:
    name: mongodb-org
    update_cache: yes
    state: present

- name: Start and enable MongoDB service
  systemd:
    name: mongod
    state: started
    enabled: true

- name: Check for mongosh
  stat:
    path: /usr/bin/mongosh
  register: mongosh_check

- name: Fail if mongosh is missing
  fail:
    msg: "mongosh shell not found! MongoDB shell required to seed the database."
  when: not mongosh_check.stat.exists

- name: Copy MongoDB upsert-based seed script
  copy:
    dest: /tmp/seed.js
    content: |
      use securedb;

      function upsertMessage(sender, content) {
        db.messages.updateOne(
          { sender: sender },
          {
            $set: {
              content: content,
              timestamp: new Date()
            }
          },
          { upsert: true }
        );
        print("✅ Upserted message from " + sender);
      }

      upsertMessage("admin", "Hello from MongoDB, Welcome to Team32!");
      upsertMessage("system", "Your app is secured and verified.");
      upsertMessage("devops", "Deployed using Ansible + Jenkins + Flask!");
      upsertMessage("ops", "Monitoring is coming soon.");

- name: Run MongoDB seed script
  shell: mongosh < /tmp/seed.js
  register: seed_output
  changed_when: "'Added message' in seed_output.stdout"

- name: Show seed result
  debug:
    var: seed_output.stdout_lines

- name: Ping MongoDB
  command: /usr/bin/mongosh --eval "db.adminCommand('ping')"
  register: mongodb_ping
  changed_when: false
  failed_when: mongodb_ping.rc != 0

- name: Check seeded messages count
  command: /usr/bin/mongosh --eval "use securedb; db.messages.countDocuments()"
  register: mongodb_messages
  changed_when: false
  failed_when: mongodb_messages.rc != 0

- name: Show seeded message count
  debug:
    var: mongodb_messages.stdout_lines

- name: View MongoDB log tail
  command: tail -n 10 /var/log/mongodb/mongod.log
  register: mongodb_logs
  changed_when: false
